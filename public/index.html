<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sharpshooter — Football Prediction Engine</title>
<link rel="preconnect" href="https://a.espncdn.com" />
<link rel="stylesheet" href="/styles.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">◎</span>
    <span class="brand-text">
      <strong>SHARPSHOOTER</strong>
      <em>prediction engine</em>
    </span>
  </div>

  <nav class="tabs" id="tabs">
    <button class="tab is-active" data-view="matches">Matches</button>
    <button class="tab" data-view="bankers">Bankers</button>
    <button class="tab" data-view="daily">Banker of the Day</button>
  </nav>

  <div class="status" id="status">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">connecting…</span>
  </div>
</header>

<div class="datebar">
  <button class="navbtn" id="prevDay" title="Previous day">‹</button>
  <div class="datepicker">
    <input type="date" id="dateInput" />
    <div class="datenav">
      <button class="quick" data-offset="0">Today</button>
      <button class="quick" data-offset="1">Tomorrow</button>
      <button class="quick" data-offset="2">+2</button>
      <button class="quick" data-offset="-1">Yesterday</button>
    </div>
  </div>
  <button class="navbtn" id="nextDay" title="Next day">›</button>
  <div class="datelabel" id="dateLabel"></div>
  <label class="toggle">
    <input type="checkbox" id="bankersOnly" />
    <span>Bankers only</span>
  </label>
  <label class="toggle">
    <input type="checkbox" id="liveRefresh" checked />
    <span>Auto-refresh</span>
  </label>
</div>

<main class="layout">
  <section class="board" id="board">
    <div class="loading" id="boardLoading">
      <div class="spinner"></div>
      <p>Pulling live fixtures…</p>
    </div>
  </section>

  <aside class="detail" id="detail" aria-hidden="true">
    <div class="detail-inner" id="detailInner"></div>
  </aside>
</main>

<div class="scrim" id="scrim"></div>

<footer class="foot">
  <span>Data: ESPN public APIs — free, no key required.</span>
  <span class="sep">•</span>
  <span>Model: Dixon-Coles bivariate Poisson on live xG/xGA.</span>
  <span class="sep">•</span>
  <span class="disclaimer">Analytical output only. No outcome is guaranteed.</span>
</footer>

<script src="/app.js"></script>
</body>
</html>
